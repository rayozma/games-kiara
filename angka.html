<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Belajar Angka</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔢</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#FF6B6B; --sun:#FFD166; --leaf:#06D6A0; --lavender:#B79CED;
    --blue:#4EA8DE; --pink:#FF8FB1; --navy:#1B3A4B; --sky:#EAF6FF;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Baloo 2', sans-serif;
    background:
      radial-gradient(circle at 8% 12%, #d5ecff 0%, transparent 40%),
      radial-gradient(circle at 92% 15%, #ffe9c7 0%, transparent 38%),
      radial-gradient(circle at 15% 90%, #d9f7ec 0%, transparent 40%),
      var(--sky);
    color:var(--navy);
    overflow:hidden;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-tap-highlight-color:transparent;
  }
  a{text-decoration:none; color:inherit;}
  button{font-family:inherit; border:none; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  button:focus-visible, .icon-btn:focus-visible{outline:4px solid var(--navy); outline-offset:3px;}
  .screen{
    position:fixed; inset:0; display:none; flex-direction:column; align-items:center;
    padding:env(safe-area-inset-top,16px) 16px env(safe-area-inset-bottom,16px);
    animation:fadeIn .35s ease;
  }
  .screen.active{display:flex;}
  @keyframes fadeIn{from{opacity:0; transform:scale(.98);} to{opacity:1; transform:scale(1);}}

  /* ---------- HOME ---------- */
  #screen-home{justify-content:center; text-align:center; gap:16px; position:relative;}
  .home-top{position:absolute; top:calc(env(safe-area-inset-top,0px) + 14px); left:16px;}
  .hero-numbers{display:flex; gap:10px;}
  .hero-numbers span{
    display:inline-flex; align-items:center; justify-content:center;
    width:clamp(52px,14vw,78px); height:clamp(52px,14vw,78px);
    border-radius:26px; font-weight:800; font-size:clamp(24px,6.5vw,36px);
    color:#fff; box-shadow:0 8px 0 rgba(0,0,0,.08);
    animation:bob 2.6s ease-in-out infinite;
  }
  .hero-numbers span:nth-child(1){background:var(--leaf); animation-delay:0s;}
  .hero-numbers span:nth-child(2){background:var(--sun); color:var(--navy); animation-delay:.2s;}
  .hero-numbers span:nth-child(3){background:var(--blue); animation-delay:.4s;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  h1{font-size:clamp(24px,6vw,34px); margin:0; font-weight:800;}
  p.tag{margin:0; font-size:clamp(15px,4vw,19px); font-weight:500; color:#3f5c6b; max-width:320px;}
  .home-btns{display:flex; flex-direction:column; gap:12px; align-items:center;}
  .btn-start, .btn-secondary{
    color:#fff; font-weight:800; font-size:clamp(19px,5vw,24px);
    padding:16px 42px; border-radius:999px; transition:transform .08s; width:260px;
  }
  .btn-start{background:var(--leaf); box-shadow:0 8px 0 #04ab82;}
  .btn-start:active{transform:translateY(6px); box-shadow:0 2px 0 #04ab82;}
  .btn-secondary{background:var(--coral); box-shadow:0 8px 0 #d94f4f;}
  .btn-secondary:active{transform:translateY(6px); box-shadow:0 2px 0 #d94f4f;}
  .garden{
    margin-top:2px; background:#ffffffb0; border-radius:24px; padding:12px 20px;
    display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px;
  }
  .garden-flowers{display:flex; gap:2px; font-size:16px; max-width:180px; flex-wrap:wrap; justify-content:center;}

  /* ---------- SHELF ---------- */
  #screen-shelf, #screen-challenge{padding-top:calc(env(safe-area-inset-top,0px) + 14px);}
  .topbar{width:100%; max-width:640px; display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .icon-btn{
    width:52px; height:52px; border-radius:18px; background:#fff; font-size:24px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 5px 0 #dfe6ea;
  }
  .icon-btn:active{transform:translateY(4px); box-shadow:none;}
  .progress-pill{background:#fff; border-radius:999px; padding:10px 18px; font-weight:700; font-size:15px; box-shadow:0 5px 0 #dfe6ea;}
  .grid{
    width:100%; max-width:640px; overflow-y:auto; display:grid;
    grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:10px; padding-bottom:20px;
  }
  .tile{
    aspect-ratio:1; border-radius:20px; color:#fff; font-weight:800; font-size:clamp(18px,4.6vw,26px);
    display:flex; align-items:center; justify-content:center; position:relative;
    box-shadow:0 6px 0 rgba(0,0,0,.1); transition:transform .08s;
  }
  .tile:active{transform:translateY(5px); box-shadow:none;}
  .tile .star{position:absolute; top:-6px; right:-6px; font-size:18px;}
  .c1{background:var(--coral);} .c2{background:var(--sun); color:var(--navy);}
  .c3{background:var(--leaf);} .c4{background:var(--lavender);}
  .c5{background:var(--blue);} .c6{background:var(--pink);}

  /* ---------- PRACTICE ---------- */
  #screen-practice{justify-content:center; gap:14px; position:relative; width:100%;}
  .practice-card{
    background:#fff; border-radius:36px; padding:26px 34px; display:flex; flex-direction:column;
    align-items:center; gap:10px; box-shadow:0 10px 0 #e2e8ee; max-width:360px; width:100%;
  }
  .big-number{font-size:clamp(70px,20vw,110px); font-weight:800; line-height:1;}
  .count-wrap{
    display:flex; flex-wrap:wrap; gap:4px; justify-content:center; max-width:260px;
    font-size:clamp(18px,5.5vw,24px); line-height:1.3;
  }
  .word{font-size:clamp(20px,6vw,28px); font-weight:700;}
  .speak-btn{
    width:66px; height:66px; border-radius:50%; background:var(--leaf); color:#fff; font-size:28px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 0 #04ab82;
  }
  .speak-btn:active{transform:translateY(5px); box-shadow:none;}
  .nav-row{display:flex; align-items:center; gap:22px;}
  .arrow-btn{width:56px; height:56px; border-radius:18px; background:#fff; font-size:24px; box-shadow:0 5px 0 #dfe6ea;}
  .arrow-btn:active{transform:translateY(4px); box-shadow:none;}
  .practice-top{position:absolute; top:calc(env(safe-area-inset-top,0px) + 14px); left:16px;}

  /* ---------- CHALLENGE ---------- */
  #screen-challenge{justify-content:flex-start; align-items:center; gap:26px; width:100%;}
  .challenge-prompt{
    background:#fff; border-radius:32px; padding:22px 30px; display:flex; flex-direction:column;
    align-items:center; gap:10px; box-shadow:0 10px 0 #e2e8ee; margin-top:10px;
  }
  .challenge-prompt .glyph{font-size:44px;}
  .challenge-prompt p{margin:0; font-weight:700; font-size:clamp(17px,5vw,21px);}
  .challenge-options{display:flex; gap:16px; flex-wrap:wrap; justify-content:center; max-width:360px;}
  .choice-tile{
    width:clamp(76px,22vw,96px); height:clamp(76px,22vw,96px); border-radius:26px; color:#fff;
    font-weight:800; font-size:clamp(26px,7vw,34px); display:flex; align-items:center; justify-content:center;
    box-shadow:0 7px 0 rgba(0,0,0,.12); transition:transform .08s;
  }
  .choice-tile:active{transform:translateY(5px); box-shadow:none;}
  .choice-tile.shake{animation:shake .5s ease;}
  .choice-tile.correct-flash{animation:pulseGood .5s ease;}
  @keyframes shake{
    10%,90%{transform:translateX(-4px);} 20%,80%{transform:translateX(6px);}
    30%,50%,70%{transform:translateX(-10px);} 40%,60%{transform:translateX(10px);}
  }
  @keyframes pulseGood{0%{transform:scale(1);}50%{transform:scale(1.18);}100%{transform:scale(1);}}

  .burst{position:fixed; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center; font-size:60px; opacity:0; z-index:5;}
  .burst.show{animation:pop .9s ease forwards;}
  @keyframes pop{0%{opacity:0; transform:scale(.4);}30%{opacity:1; transform:scale(1.15);}70%{opacity:1;}100%{opacity:0; transform:scale(1.3);}}

  @media (prefers-reduced-motion: reduce){ .hero-numbers span{animation:none;} }
</style>
</head>
<body>

<div id="screen-home" class="screen active">
  <a class="icon-btn home-top" href="index.html" aria-label="Menu Utama">🏠</a>
  <div class="hero-numbers"><span>1</span><span>2</span><span>3</span></div>
  <h1>Belajar Angka</h1>
  <p class="tag">Yuk berhitung sambil main, dari 1 sampai 20!</p>
  <div class="home-btns">
    <button class="btn-start" id="btnStart">Belajar Angka 🔢</button>
    <button class="btn-secondary" id="btnChallenge">Tantangan Angka 🎯</button>
  </div>
  <div class="garden">
    <span id="homeCount">0 / 20 angka</span>
    <div class="garden-flowers" id="homeFlowers"></div>
  </div>
</div>

<div id="screen-shelf" class="screen">
  <div class="topbar">
    <button class="icon-btn" id="btnHomeFromShelf" aria-label="Kembali ke beranda">🏠</button>
    <div class="progress-pill" id="shelfCount">0 / 20</div>
  </div>
  <div class="grid" id="numGrid"></div>
</div>

<div id="screen-practice" class="screen">
  <button class="icon-btn practice-top" id="btnHomeFromPractice" aria-label="Kembali ke daftar angka">🏠</button>
  <div class="practice-card">
    <div class="big-number" id="pNum">1</div>
    <div class="count-wrap" id="pCount"></div>
    <div class="word" id="pWord">Satu</div>
    <button class="speak-btn" id="btnSpeak" aria-label="Dengar lagi">🔊</button>
  </div>
  <div class="nav-row">
    <button class="arrow-btn" id="btnPrev" aria-label="Angka sebelumnya">⬅️</button>
    <button class="arrow-btn" id="btnNext" aria-label="Angka berikutnya">➡️</button>
  </div>
</div>

<div id="screen-challenge" class="screen">
  <div class="topbar">
    <button class="icon-btn" id="btnHomeFromChallenge" aria-label="Kembali ke beranda">🏠</button>
    <div class="progress-pill" id="challengeScore">⭐ 0</div>
  </div>
  <div class="challenge-prompt">
    <div class="glyph">🔎</div>
    <p>Dengarkan, lalu cari angkanya!</p>
    <button class="speak-btn" id="btnChallengeReplay" aria-label="Dengar lagi">🔊</button>
  </div>
  <div class="challenge-options" id="challengeOptions"></div>
</div>

<div class="burst" id="burst">🌟</div>

<script>
const DATA = [
  {n:1,  w:'Satu'},        {n:2,  w:'Dua'},          {n:3,  w:'Tiga'},
  {n:4,  w:'Empat'},       {n:5,  w:'Lima'},         {n:6,  w:'Enam'},
  {n:7,  w:'Tujuh'},       {n:8,  w:'Delapan'},      {n:9,  w:'Sembilan'},
  {n:10, w:'Sepuluh'},     {n:11, w:'Sebelas'},      {n:12, w:'Dua Belas'},
  {n:13, w:'Tiga Belas'},  {n:14, w:'Empat Belas'},  {n:15, w:'Lima Belas'},
  {n:16, w:'Enam Belas'},  {n:17, w:'Tujuh Belas'},  {n:18, w:'Delapan Belas'},
  {n:19, w:'Sembilan Belas'}, {n:20, w:'Dua Puluh'}
];
const COLORS = ['c1','c2','c3','c4','c5','c6'];
const COUNT_ICON = '⭐';
const STORAGE_KEY = 'belajar-angka-progress-v1';

let progress = loadProgress();
let currentIndex = 0;
let challengeScore = 0;
let currentChallenge = null;
let keyBuffer = '';
let keyBufferTimer = null;

function loadProgress(){
  try{ return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)) || []); }
  catch(e){ return new Set(); }
}
function saveProgress(){ localStorage.setItem(STORAGE_KEY, JSON.stringify([...progress])); }

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}
function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ---- voice ---- */
let voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices(); }
loadVoices();
if ('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;
function pickVoice(){
  return voices.find(v => v.lang === 'id-ID' && /female|perempuan|wanita/i.test(v.name))
      || voices.find(v => v.lang === 'id-ID')
      || voices.find(v => v.lang && v.lang.startsWith('id'))
      || null;
}
function speakText(text){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'id-ID'; u.rate = 0.82; u.pitch = 1.15;
  const v = pickVoice(); if (v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ---- progress UI ---- */
function renderProgress(){
  const count = progress.size;
  document.getElementById('homeCount').textContent = count + ' / 20 angka';
  document.getElementById('shelfCount').textContent = count + ' / 20';
  const flowerBox = document.getElementById('homeFlowers');
  flowerBox.innerHTML = '';
  for (let i = 0; i < count; i++){
    const s = document.createElement('span'); s.textContent = '🌼'; flowerBox.appendChild(s);
  }
  document.querySelectorAll('.tile .star').forEach(st => {
    const num = st.parentElement.dataset.num;
    st.style.display = progress.has(num) ? 'inline' : 'none';
  });
}
function markLearned(num){
  const key = String(num);
  const isNew = !progress.has(key);
  progress.add(key); saveProgress(); renderProgress();
  return isNew;
}

/* ---- build shelf ---- */
const grid = document.getElementById('numGrid');
DATA.forEach((d, i) => {
  const tile = document.createElement('button');
  tile.className = 'tile ' + COLORS[i % COLORS.length];
  tile.dataset.num = d.n;
  tile.innerHTML = d.n + '<span class="star" style="display:none">⭐</span>';
  tile.addEventListener('click', () => openPractice(i));
  grid.appendChild(tile);
});

/* ---- practice screen (learn mode) ---- */
function openPractice(index){
  currentIndex = ((index % DATA.length) + DATA.length) % DATA.length;
  const d = DATA[currentIndex];
  document.getElementById('pNum').textContent = d.n;
  document.getElementById('pCount').textContent = COUNT_ICON.repeat(d.n);
  document.getElementById('pWord').textContent = d.w;
  showScreen('practice');
  const isNew = markLearned(d.n);
  setTimeout(() => speakText(d.w), 300);
  if (isNew) celebrate();
}
function celebrate(){
  const b = document.getElementById('burst');
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}

/* ---- challenge mode (find the number) ---- */
function newChallengeRound(){
  const targetIdx = Math.floor(Math.random() * DATA.length);
  const target = DATA[targetIdx];
  let pool = shuffle(DATA.filter((d, i) => i !== targetIdx));
  const options = shuffle([target, pool[0], pool[1]]);
  currentChallenge = target.n;

  const box = document.getElementById('challengeOptions');
  box.innerHTML = '';
  options.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'choice-tile ' + COLORS[Math.floor(Math.random() * COLORS.length)];
    btn.textContent = d.n;
    btn.dataset.num = d.n;
    btn.addEventListener('click', () => answerChallenge(btn, d.n));
    box.appendChild(btn);
  });
  setTimeout(() => speakText('Cari angka ' + target.n), 350);
}
function answerChallenge(btn, num){
  if (num === currentChallenge){
    btn.classList.add('correct-flash');
    challengeScore++;
    document.getElementById('challengeScore').textContent = '⭐ ' + challengeScore;
    markLearned(num);
    celebrate();
    setTimeout(newChallengeRound, 900);
  } else {
    btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
    setTimeout(() => speakText('Cari angka ' + currentChallenge), 500);
  }
}
function startChallenge(){
  challengeScore = 0;
  document.getElementById('challengeScore').textContent = '⭐ 0';
  showScreen('challenge');
  newChallengeRound();
}

/* ---- nav buttons ---- */
document.getElementById('btnStart').addEventListener('click', () => showScreen('shelf'));
document.getElementById('btnChallenge').addEventListener('click', startChallenge);
document.getElementById('btnHomeFromShelf').addEventListener('click', () => showScreen('home'));
document.getElementById('btnHomeFromPractice').addEventListener('click', () => showScreen('shelf'));
document.getElementById('btnHomeFromChallenge').addEventListener('click', () => { speechSynthesis.cancel(); showScreen('home'); });
document.getElementById('btnSpeak').addEventListener('click', () => { speakText(DATA[currentIndex].w); });
document.getElementById('btnChallengeReplay').addEventListener('click', () => {
  if (currentChallenge) speakText('Cari angka ' + currentChallenge);
});
document.getElementById('btnPrev').addEventListener('click', () => openPractice(currentIndex - 1));
document.getElementById('btnNext').addEventListener('click', () => openPractice(currentIndex + 1));

/* ---- keyboard support (digit buffer handles two-digit numbers) ---- */
function bufferDigit(d){
  keyBuffer += d;
  clearTimeout(keyBufferTimer);
  keyBufferTimer = setTimeout(() => { keyBuffer = ''; }, 700);
  return keyBuffer;
}
window.addEventListener('keydown', (ev) => {
  const key = ev.key;
  const activeScreen = document.querySelector('.screen.active').id;

  if (activeScreen === 'screen-challenge'){
    if (/^[0-9]$/.test(key)){
      const buf = bufferDigit(key);
      const btn = document.querySelector('.choice-tile[data-num="' + buf + '"]');
      if (btn){ btn.click(); keyBuffer = ''; }
    } else if (key === ' ' || key === 'Enter'){
      ev.preventDefault();
      if (currentChallenge) speakText('Cari angka ' + currentChallenge);
    } else if (key === 'Escape' || key === 'Backspace'){
      speechSynthesis.cancel(); showScreen('home');
    }
    return;
  }

  if (/^[0-9]$/.test(key)){
    const buf = bufferDigit(key);
    const idx = DATA.findIndex(d => String(d.n) === buf);
    if (idx > -1){ openPractice(idx); keyBuffer = ''; }
    return;
  }
  if (key === 'Escape' || key === 'Backspace'){
    if (activeScreen === 'screen-practice') showScreen('shelf');
    else if (activeScreen === 'screen-shelf') showScreen('home');
  }
  if (activeScreen === 'screen-practice'){
    if (key === 'ArrowRight') openPractice(currentIndex + 1);
    if (key === 'ArrowLeft') openPractice(currentIndex - 1);
    if (key === ' ' || key === 'Enter'){ ev.preventDefault(); speakText(DATA[currentIndex].w); }
  }
  if (activeScreen === 'screen-home' && (key === 'Enter' || key === ' ')){
    showScreen('shelf');
  }
});

renderProgress();
</script>
</body>
</html>
