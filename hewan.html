<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Belajar Hewan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#FF6B6B; --sun:#FFD166; --leaf:#06D6A0; --lavender:#B79CED;
    --blue:#4EA8DE; --pink:#FF8FB1; --navy:#1B3A4B; --sky:#EAF6FF;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Baloo 2', sans-serif;
    background:
      radial-gradient(circle at 8% 12%, #d5ecff 0%, transparent 40%),
      radial-gradient(circle at 92% 15%, #ffe9c7 0%, transparent 38%),
      radial-gradient(circle at 15% 90%, #d9f7ec 0%, transparent 40%),
      var(--sky);
    color:var(--navy);
    overflow:hidden;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-tap-highlight-color:transparent;
  }
  a{text-decoration:none; color:inherit;}
  button{font-family:inherit; border:none; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  button:focus-visible, .icon-btn:focus-visible{outline:4px solid var(--navy); outline-offset:3px;}
  .screen{
    position:fixed; inset:0; display:none; flex-direction:column; align-items:center;
    padding:env(safe-area-inset-top,16px) 16px env(safe-area-inset-bottom,16px);
    animation:fadeIn .35s ease;
  }
  .screen.active{display:flex;}
  @keyframes fadeIn{from{opacity:0; transform:scale(.98);} to{opacity:1; transform:scale(1);}}

  /* ---------- HOME ---------- */
  #screen-home{justify-content:center; text-align:center; gap:16px; position:relative;}
  .home-top{position:absolute; top:calc(env(safe-area-inset-top,0px) + 14px); left:16px;}
  .mute-btn{position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); right:16px; z-index:20;}
  .hero-animals{display:flex; gap:10px;}
  .hero-animals span{
    display:inline-flex; align-items:center; justify-content:center;
    width:clamp(52px,14vw,78px); height:clamp(52px,14vw,78px);
    border-radius:26px; font-size:clamp(28px,7.5vw,42px);
    background:#fff; box-shadow:0 8px 0 rgba(0,0,0,.08);
    animation:bob 2.6s ease-in-out infinite;
  }
  .hero-animals span:nth-child(1){animation-delay:0s;}
  .hero-animals span:nth-child(2){animation-delay:.2s;}
  .hero-animals span:nth-child(3){animation-delay:.4s;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  h1{font-size:clamp(24px,6vw,34px); margin:0; font-weight:800;}
  p.tag{margin:0; font-size:clamp(15px,4vw,19px); font-weight:500; color:#3f5c6b; max-width:320px;}
  .home-btns{display:flex; flex-direction:column; gap:12px; align-items:center;}
  .btn-start, .btn-secondary{
    color:#fff; font-weight:800; font-size:clamp(19px,5vw,24px);
    padding:16px 42px; border-radius:999px; transition:transform .08s; width:260px;
  }
  .btn-start{background:var(--lavender); box-shadow:0 8px 0 #9273c9;}
  .btn-start:active{transform:translateY(6px); box-shadow:0 2px 0 #9273c9;}
  .btn-secondary{background:var(--coral); box-shadow:0 8px 0 #d94f4f;}
  .btn-secondary:active{transform:translateY(6px); box-shadow:0 2px 0 #d94f4f;}
  .garden{
    margin-top:2px; background:#ffffffb0; border-radius:24px; padding:12px 20px;
    display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px;
  }
  .garden-flowers{display:flex; gap:2px; font-size:16px; max-width:180px; flex-wrap:wrap; justify-content:center;}

  /* ---------- SHELF ---------- */
  #screen-shelf, #screen-challenge{padding-top:calc(env(safe-area-inset-top,0px) + 14px);}
  .topbar{width:100%; max-width:640px; padding-right:62px; display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .icon-btn{
    width:52px; height:52px; border-radius:18px; background:#fff; font-size:24px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 5px 0 #dfe6ea;
  }
  .icon-btn:active{transform:translateY(4px); box-shadow:none;}
  .progress-pill{background:#fff; border-radius:999px; padding:10px 18px; font-weight:700; font-size:15px; box-shadow:0 5px 0 #dfe6ea;}
  .grid{
    width:100%; max-width:640px; overflow-y:auto; display:grid;
    grid-template-columns:repeat(auto-fill,minmax(68px,1fr)); gap:10px; padding-bottom:20px;
  }
  .tile{
    aspect-ratio:1; border-radius:20px; background:#fff; font-size:clamp(26px,7vw,36px);
    display:flex; align-items:center; justify-content:center; position:relative;
    box-shadow:0 6px 0 rgba(0,0,0,.08); transition:transform .08s;
  }
  .tile:active{transform:translateY(5px); box-shadow:none;}
  .tile .star{position:absolute; top:-6px; right:-6px; font-size:18px;}

  /* ---------- PRACTICE ---------- */
  #screen-practice{justify-content:center; gap:14px; position:relative; width:100%;}
  .practice-card{
    background:#fff; border-radius:36px; padding:30px 34px; display:flex; flex-direction:column;
    align-items:center; gap:12px; box-shadow:0 10px 0 #e2e8ee; max-width:360px; width:100%;
  }
  .big-emoji{font-size:clamp(80px,26vw,130px); line-height:1;}
  .word{font-size:clamp(22px,6.5vw,30px); font-weight:800;}
  .speak-btn{
    width:66px; height:66px; border-radius:50%; background:var(--lavender); color:#fff; font-size:28px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 0 #9273c9;
  }
  .speak-btn:active{transform:translateY(5px); box-shadow:none;}
  .nav-row{display:flex; align-items:center; gap:22px;}
  .arrow-btn{width:56px; height:56px; border-radius:18px; background:#fff; font-size:24px; box-shadow:0 5px 0 #dfe6ea;}
  .arrow-btn:active{transform:translateY(4px); box-shadow:none;}
  .practice-top{position:absolute; top:calc(env(safe-area-inset-top,0px) + 14px); left:16px;}

  /* ---------- CHALLENGE ---------- */
  #screen-challenge{justify-content:flex-start; align-items:center; gap:26px; width:100%;}
  .challenge-prompt{
    background:#fff; border-radius:32px; padding:22px 30px; display:flex; flex-direction:column;
    align-items:center; gap:10px; box-shadow:0 10px 0 #e2e8ee; margin-top:10px;
  }
  .challenge-prompt .glyph{font-size:44px;}
  .challenge-prompt p{margin:0; font-weight:700; font-size:clamp(17px,5vw,21px);}
  .challenge-options{display:flex; gap:16px; flex-wrap:wrap; justify-content:center; max-width:360px;}
  .choice-tile{
    width:clamp(84px,24vw,104px); height:clamp(84px,24vw,104px); border-radius:26px; background:#fff;
    font-size:clamp(38px,10vw,50px); display:flex; align-items:center; justify-content:center;
    box-shadow:0 7px 0 rgba(0,0,0,.1); transition:transform .08s;
  }
  .choice-tile:active{transform:translateY(5px); box-shadow:none;}
  .choice-tile.shake{animation:shake .5s ease;}
  .choice-tile.correct-flash{animation:pulseGood .5s ease;}
  @keyframes shake{
    10%,90%{transform:translateX(-4px);} 20%,80%{transform:translateX(6px);}
    30%,50%,70%{transform:translateX(-10px);} 40%,60%{transform:translateX(10px);}
  }
  @keyframes pulseGood{0%{transform:scale(1);}50%{transform:scale(1.18);}100%{transform:scale(1);}}

  .burst{position:fixed; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center; font-size:60px; opacity:0; z-index:5;}
  .burst.show{animation:pop .9s ease forwards;}
  @keyframes pop{0%{opacity:0; transform:scale(.4);}30%{opacity:1; transform:scale(1.15);}70%{opacity:1;}100%{opacity:0; transform:scale(1.3);}}

  @media (prefers-reduced-motion: reduce){ .hero-animals span{animation:none;} }

  /* ===== device tuning ===== */
  html{touch-action:manipulation;}
  body{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  .mute-btn{right:calc(env(safe-area-inset-right,0px) + 16px);}
  .home-top, .practice-top{left:calc(env(safe-area-inset-left,0px) + 16px);}
  .screen{overflow-y:auto; padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right));}
  #screen-home, #screen-practice{position:fixed; justify-content:safe center;}
  #screen-practice{padding-top:calc(env(safe-area-inset-top,0px) + 76px);}
  .grid{flex:1; min-height:0; align-content:start;}

  @media (orientation: landscape) and (max-height: 520px){
    .screen{padding-top:calc(env(safe-area-inset-top,0px) + 10px); padding-bottom:10px;}
    #screen-home{gap:8px;}
    #screen-home .tag{display:none;}
    .hero-letters span, .hero-numbers span, .hero-animals span{width:46px; height:46px; border-radius:16px; font-size:24px;}
    h1{font-size:24px;}
    .home-btns{flex-direction:row;}
    .btn-start, .btn-secondary{width:auto; padding:12px 26px; font-size:18px;}
    .garden{padding:6px 16px;}
    #screen-practice{flex-direction:row; gap:28px; padding-top:calc(env(safe-area-inset-top,0px) + 10px);}
    .practice-card{padding:14px 30px; gap:4px; width:auto; min-width:260px;}
    .big-letters .up{font-size:28vh;} .big-letters .low{font-size:17vh;}
    .big-number{font-size:26vh;} .emoji{font-size:15vh;} .big-emoji{font-size:32vh;}
    .word{font-size:22px;}
    .count-wrap{max-width:380px; font-size:18px;}
    .speak-btn{width:52px; height:52px; font-size:22px;}
    .nav-row{flex-direction:column; gap:14px;}
    #screen-challenge{flex-direction:row; flex-wrap:wrap; justify-content:center; align-content:flex-start; column-gap:28px; row-gap:10px;}
    #screen-challenge .topbar{flex-basis:100%; max-width:none; margin-bottom:0;}
    .challenge-prompt{margin-top:0; padding:12px 22px; gap:6px;}
    .challenge-prompt .glyph{font-size:28px;}
    .challenge-options{flex-wrap:nowrap; max-width:none; align-self:center;}
    .choice-tile{width:clamp(76px,24vh,100px); height:clamp(76px,24vh,100px);}
  }

  @media (min-width: 700px) and (min-height: 700px){
    .icon-btn{width:64px; height:64px; font-size:30px; border-radius:22px;}
    .topbar{max-width:900px; padding-right:78px;}
    .progress-pill{font-size:19px; padding:12px 24px;}
    #screen-practice{padding-top:calc(env(safe-area-inset-top,0px) + 90px);}
    .hero-letters span, .hero-numbers span, .hero-animals span{width:96px; height:96px; border-radius:30px; font-size:48px;}
    h1{font-size:46px;} p.tag{font-size:22px; max-width:460px;}
    .btn-start, .btn-secondary{width:360px; font-size:28px; padding:20px 42px;}
    .garden{font-size:18px; padding:14px 26px;} .garden-flowers{font-size:20px; max-width:320px;}
    .practice-card{max-width:500px; padding:36px 48px; gap:14px;}
    .big-letters .up{font-size:170px;} .big-letters .low{font-size:100px;}
    .big-number{font-size:160px;} .emoji{font-size:96px;} .big-emoji{font-size:180px;}
    .word{font-size:38px;} .count-wrap{max-width:420px; font-size:30px;}
    .speak-btn{width:84px; height:84px; font-size:36px;}
    .arrow-btn{width:76px; height:76px; font-size:32px; border-radius:24px;}
    .grid{max-width:900px; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:16px;}
    .tile{font-size:40px; border-radius:28px;}
    #screen-challenge{gap:40px;}
    .challenge-prompt{padding:30px 48px; gap:14px;} .challenge-prompt p{font-size:28px;} .challenge-prompt .glyph{font-size:60px;}
    .challenge-options{max-width:640px; gap:26px;}
    .choice-tile{width:160px; height:160px; font-size:60px; border-radius:36px;}
  }

  @media (min-width: 700px) and (min-height: 700px){ .tile{font-size:52px;} .choice-tile{font-size:88px;} }
</style>
</head>
<body>

<audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
<button class="icon-btn mute-btn" id="btnMute" aria-label="Suara latar belakang">🔊</button>

<div id="screen-home" class="screen active">
  <a class="icon-btn home-top" href="index.html" aria-label="Menu Utama">🏠</a>
  <div class="hero-animals"><span>🐱</span><span>🐶</span><span>🐰</span></div>
  <h1>Belajar Hewan</h1>
  <p class="tag">Yuk kenalan sama hewan-hewan lucu di sekitar kita!</p>
  <div class="home-btns">
    <button class="btn-start" id="btnStart">Belajar Hewan 🐾</button>
    <button class="btn-secondary" id="btnChallenge">Tantangan Hewan 🎯</button>
  </div>
  <div class="garden">
    <span id="homeCount">0 / 20 hewan</span>
    <div class="garden-flowers" id="homeFlowers"></div>
  </div>
</div>

<div id="screen-shelf" class="screen">
  <div class="topbar">
    <button class="icon-btn" id="btnHomeFromShelf" aria-label="Kembali ke beranda">🏠</button>
    <div class="progress-pill" id="shelfCount">0 / 20</div>
  </div>
  <div class="grid" id="animalGrid"></div>
</div>

<div id="screen-practice" class="screen">
  <button class="icon-btn practice-top" id="btnHomeFromPractice" aria-label="Kembali ke daftar hewan">🏠</button>
  <div class="practice-card">
    <div class="big-emoji" id="pEmoji">🐱</div>
    <div class="word" id="pWord">Kucing</div>
    <button class="speak-btn" id="btnSpeak" aria-label="Dengar lagi">🔊</button>
  </div>
  <div class="nav-row">
    <button class="arrow-btn" id="btnPrev" aria-label="Hewan sebelumnya">⬅️</button>
    <button class="arrow-btn" id="btnNext" aria-label="Hewan berikutnya">➡️</button>
  </div>
</div>

<div id="screen-challenge" class="screen">
  <div class="topbar">
    <button class="icon-btn" id="btnHomeFromChallenge" aria-label="Kembali ke beranda">🏠</button>
    <div class="progress-pill" id="challengeScore">⭐ 0</div>
  </div>
  <div class="challenge-prompt">
    <div class="glyph">🔎</div>
    <p>Dengarkan, lalu cari hewannya!</p>
    <button class="speak-btn" id="btnChallengeReplay" aria-label="Dengar lagi">🔊</button>
  </div>
  <div class="challenge-options" id="challengeOptions"></div>
</div>

<div class="burst" id="burst">🌟</div>

<script>
const DATA = [
  {name:'Kucing', e:'🐱'}, {name:'Anjing', e:'🐶'}, {name:'Sapi', e:'🐄'},
  {name:'Ayam', e:'🐔'}, {name:'Bebek', e:'🦆'}, {name:'Kuda', e:'🐴'},
  {name:'Kambing', e:'🐐'}, {name:'Gajah', e:'🐘'}, {name:'Singa', e:'🦁'},
  {name:'Harimau', e:'🐯'}, {name:'Jerapah', e:'🦒'}, {name:'Monyet', e:'🐒'},
  {name:'Kelinci', e:'🐰'}, {name:'Ikan', e:'🐟'}, {name:'Burung', e:'🐦'},
  {name:'Ular', e:'🐍'}, {name:'Buaya', e:'🐊'}, {name:'Panda', e:'🐼'},
  {name:'Zebra', e:'🦓'}, {name:'Kupu-kupu', e:'🦋'}
];
const STORAGE_KEY = 'belajar-hewan-progress-v1';

let progress = loadProgress();
let currentIndex = 0;
let challengeScore = 0;
let currentChallenge = null;

function loadProgress(){
  try{ return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)) || []); }
  catch(e){ return new Set(); }
}
function saveProgress(){ localStorage.setItem(STORAGE_KEY, JSON.stringify([...progress])); }

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}
function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ---- voice ---- */
let voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices(); }
if ('speechSynthesis' in window){ loadVoices(); if ('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(){
  return voices.find(v => v.lang === 'id-ID' && /female|perempuan|wanita/i.test(v.name))
      || voices.find(v => v.lang === 'id-ID')
      || voices.find(v => v.lang && v.lang.startsWith('id'))
      || null;
}

let bgmGain = null, bgmLevel = 0.22;
const VOLUME_WORKS = (() => { try{ const a = new Audio(); a.volume = 0.5; return a.volume === 0.5; } catch(e){ return true; } })();
function setBgmVol(v){
  bgmLevel = v;
  const bgm = document.getElementById('bgm'); if (!bgm) return;
  if (bgmGain) bgmGain.gain.value = bgm.muted ? 0 : v; else bgm.volume = v;
}
const SILENT = 'data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';
const voiceEl = new Audio(); voiceEl.preload = 'auto';
let voiceToken = 0;
function browserSpeak(text, fin){
  if (!('speechSynthesis' in window)){ setTimeout(fin, 1500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'id-ID'; u.rate = 0.82; u.pitch = 1.15;
  const v = pickVoice(); if (v) u.voice = v;
  u.onstart = () => setBgmVol(0.06);
  u.onend = fin; u.onerror = fin;
  window._utter = u;
  speechSynthesis.speak(u);
}
function stopVoice(){
  voiceToken++; voiceEl.pause();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  setBgmVol(0.22);
}
function speakText(text, onEnd){
  const token = ++voiceToken;
  let done = false, fellBack = false;
  const fin = () => { if (done) return; done = true; setBgmVol(0.22); if (onEnd) onEnd(); };
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  voiceEl.pause();
  const slug = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const fallback = () => { if (fellBack || token !== voiceToken) return; fellBack = true; browserSpeak(text, fin); };
  voiceEl.onplaying = () => { if (token === voiceToken) setBgmVol(0.06); };
  voiceEl.onended = () => { if (token === voiceToken) fin(); };
  voiceEl.onerror = fallback;
  voiceEl.src = 'audio/' + slug + '.mp3';
  voiceEl.play().catch(err => { if (err && err.name === 'AbortError') return; fallback(); });
  if (onEnd) setTimeout(fin, 8000);
}

/* ---- correct-answer chime ---- */
let sfxCtx = null;
function playCorrectSound(){
  try{
    sfxCtx = sfxCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99];
    notes.forEach((freq, i) => {
      const osc = sfxCtx.createOscillator();
      const gain = sfxCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const start = sfxCtx.currentTime + i * 0.09;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.28, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
      osc.connect(gain); gain.connect(sfxCtx.destination);
      osc.start(start); osc.stop(start + 0.32);
    });
  } catch(e){}
}

/* ---- background music ---- */
function initBgm(){
  const bgm = document.getElementById('bgm');
  const btn = document.getElementById('btnMute');
  bgm.muted = localStorage.getItem('bgm-muted') === '1';
  bgm.volume = bgmLevel;
  const icon = () => { btn.textContent = bgm.muted ? '🔇' : '🔊'; };
  icon();
  const unlock = () => {
    try{
      if (typeof sfxCtx !== 'undefined'){
        sfxCtx = sfxCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (!VOLUME_WORKS && !bgmGain && location.protocol.startsWith('http')){
          const src = sfxCtx.createMediaElementSource(bgm);
          bgmGain = sfxCtx.createGain(); src.connect(bgmGain); bgmGain.connect(sfxCtx.destination);
          bgm.volume = 1; setBgmVol(bgmLevel);
        }
        if (sfxCtx.state === 'suspended') sfxCtx.resume();
      }
    } catch(e){}
    bgm.play().catch(() => {});
    if (typeof voiceEl !== 'undefined' && !voiceEl.getAttribute('src')){ voiceEl.src = SILENT; voiceEl.play().catch(() => {}); }
  };
  bgm.play().catch(() => {});
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach(evt => window.addEventListener(evt, unlock, { once: true }));
  btn.addEventListener('click', () => {
    bgm.muted = !bgm.muted;
    localStorage.setItem('bgm-muted', bgm.muted ? '1' : '0');
    icon(); setBgmVol(bgmLevel);
  });
}


/* ---- progress UI ---- */
function renderProgress(){
  const count = progress.size;
  document.getElementById('homeCount').textContent = count + ' / 20 hewan';
  document.getElementById('shelfCount').textContent = count + ' / 20';
  const flowerBox = document.getElementById('homeFlowers');
  flowerBox.innerHTML = '';
  for (let i = 0; i < count; i++){
    const s = document.createElement('span'); s.textContent = '🌼'; flowerBox.appendChild(s);
  }
  document.querySelectorAll('.tile .star').forEach(st => {
    const name = st.parentElement.dataset.name;
    st.style.display = progress.has(name) ? 'inline' : 'none';
  });
}
function markLearned(name){
  const isNew = !progress.has(name);
  progress.add(name); saveProgress(); renderProgress();
  return isNew;
}

/* ---- build shelf ---- */
const grid = document.getElementById('animalGrid');
DATA.forEach((d, i) => {
  const tile = document.createElement('button');
  tile.className = 'tile';
  tile.dataset.name = d.name;
  tile.innerHTML = d.e + '<span class="star" style="display:none">⭐</span>';
  tile.addEventListener('click', () => openPractice(i));
  grid.appendChild(tile);
});

/* ---- practice screen (learn mode) ---- */
function openPractice(index){
  currentIndex = ((index % DATA.length) + DATA.length) % DATA.length;
  const d = DATA[currentIndex];
  document.getElementById('pEmoji').textContent = d.e;
  document.getElementById('pWord').textContent = d.name;
  showScreen('practice');
  const isNew = markLearned(d.name);
  setTimeout(() => speakText(d.name), 300);
  if (isNew) celebrate();
}
function celebrate(){
  const b = document.getElementById('burst');
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}

/* ---- challenge mode (find the animal) ---- */
function newChallengeRound(){
  const targetIdx = Math.floor(Math.random() * DATA.length);
  const target = DATA[targetIdx];
  let pool = shuffle(DATA.filter((d, i) => i !== targetIdx));
  const options = shuffle([target, pool[0], pool[1]]);
  currentChallenge = target.name;

  const box = document.getElementById('challengeOptions');
  box.innerHTML = '';
  options.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'choice-tile';
    btn.textContent = d.e;
    btn.dataset.name = d.name;
    btn.addEventListener('click', () => answerChallenge(btn, d.name));
    box.appendChild(btn);
  });
  setTimeout(() => speakText('Cari ' + target.name), 350);
}
function answerChallenge(btn, name){
  if (name === currentChallenge){
    btn.classList.add('correct-flash');
    challengeScore++;
    document.getElementById('challengeScore').textContent = '⭐ ' + challengeScore;
    markLearned(name);
    celebrate();
    playCorrectSound();
    setTimeout(newChallengeRound, 900);
  } else {
    btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
    setTimeout(() => speakText('Cari ' + currentChallenge), 500);
  }
}
function startChallenge(){
  challengeScore = 0;
  document.getElementById('challengeScore').textContent = '⭐ 0';
  showScreen('challenge');
  newChallengeRound();
}

/* ---- nav buttons ---- */
document.getElementById('btnStart').addEventListener('click', () => showScreen('shelf'));
document.getElementById('btnChallenge').addEventListener('click', startChallenge);
document.getElementById('btnHomeFromShelf').addEventListener('click', () => showScreen('home'));
document.getElementById('btnHomeFromPractice').addEventListener('click', () => showScreen('shelf'));
document.getElementById('btnHomeFromChallenge').addEventListener('click', () => { stopVoice(); showScreen('home'); });
document.getElementById('btnSpeak').addEventListener('click', () => { speakText(DATA[currentIndex].name); });
document.getElementById('btnChallengeReplay').addEventListener('click', () => {
  if (currentChallenge) speakText('Cari ' + currentChallenge);
});
document.getElementById('btnPrev').addEventListener('click', () => openPractice(currentIndex - 1));
document.getElementById('btnNext').addEventListener('click', () => openPractice(currentIndex + 1));

/* ---- keyboard support ---- */
window.addEventListener('keydown', (ev) => {
  const key = ev.key;
  const activeScreen = document.querySelector('.screen.active').id;

  if (activeScreen === 'screen-challenge'){
    if (key === ' ' || key === 'Enter'){
      ev.preventDefault();
      if (currentChallenge) speakText('Cari ' + currentChallenge);
    } else if (key === 'Escape' || key === 'Backspace'){
      stopVoice(); showScreen('home');
    } else if (key >= '1' && key <= '3'){
      const btn = document.querySelectorAll('.choice-tile')[Number(key) - 1];
      if (btn) btn.click();
    }
    return;
  }

  if (key === 'Escape' || key === 'Backspace'){
    if (activeScreen === 'screen-practice') showScreen('shelf');
    else if (activeScreen === 'screen-shelf') showScreen('home');
  }
  if (activeScreen === 'screen-practice'){
    if (key === 'ArrowRight') openPractice(currentIndex + 1);
    if (key === 'ArrowLeft') openPractice(currentIndex - 1);
    if (key === ' ' || key === 'Enter'){ ev.preventDefault(); speakText(DATA[currentIndex].name); }
  }
  if (activeScreen === 'screen-home' && (key === 'Enter' || key === ' ')){
    showScreen('shelf');
  }
});

renderProgress();
initBgm();
</script>
</body>
</html>
